# Vessel config that is NOT in the `vessels` collection (D13).
# Off-hire (onHire) and daughtercraft (isDaughterCraft) come from MongoDB and need no entry here.
# Vessels can be referred to by nicename, vesselname or MMSI.

# Priority vessels get their own alert when they need action (D8).
priority = ["Windcat Dorothea", "Offshore Waddenzee", "Bloemgracht"]

# Never checked: MO4 test / demo systems. (Client "MO4" alone does NOT exclude a vessel:
# HST Hudson has client MO4 and is a real vessel.)
exclude = ["MO4_test_wc47"]

# Extra folder names, for vessels whose folder on a share differs from `vesselname`.
# Matching ignores case and treats spaces/hyphens as underscores. All matching folders are merged.
[folders]
"Bloemgracht"    = ["Bloemgracht"]                     # vesselname spliethoff_bloemgracht (Raw only)
"Brouwersgracht" = ["Brouwersgracht"]                  # vesselname spliethoff_brouwersgracht
"Boka Ndeavor"   = ["Boskalis_Ndeavor", "Ndeavour"]    # vesselname Boka_Ndeavour

# Known cases: expected to be quiet. Shown on the "Known" line instead of as a fault.
# After `until` the vessel is checked again and flagged as "registry expired".
#
# [[known]]
# vessel = "Bokalift 2"
# status = "demob"            # demob | tablet-only | no system | off-hire | daughtercraft
# reason = "not in use"
# until  = 2026-12-31
